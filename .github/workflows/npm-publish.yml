name: Publish to npm

# Publishes the `codegraph-sf` package to npm.
# Trigger by pushing a version tag:  git tag v0.1.1 && git push origin v0.1.1
# Or run manually from the Actions tab (publishes whatever version is in package.json).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write        # create the GitHub Release for the tag
  id-token: write        # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token via npm
      # Trusted Publishing. Provenance is generated automatically.
      - name: Publish
        run: npm publish --access public

      # Mirror the release on GitHub with notes from CHANGELOG-SF.md (the fork's
      # release log). Falls back to auto-generated notes if the version has no
      # section yet. Tag-triggered runs only.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Extract the `## [VER] ...` section body from CHANGELOG-SF.md.
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG-SF.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
